<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ניהול פניות | מתקפלים</title><style>body{margin:0;background:#111;color:#f8f6f1;font-family:Arial,sans-serif;padding:32px}main{max-width:1000px;margin:auto}h1{font-size:32px}input,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #444}input{background:#1d1d1d;color:#fff}button{background:#e5c158;border:0;cursor:pointer;font-weight:700}form{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0}.panel{background:#191919;border:1px solid #333;border-radius:14px;padding:22px}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{padding:12px;border-bottom:1px solid #333;text-align:right}small{color:#aaa}.hidden{display:none}.error{color:#ff9e9e}.empty{color:#aaa}</style></head>
<body><main><h1>ניהול פניות</h1><section class="panel" id="login"><p>הכניסה מיועדת למנהל האתר בלבד.</p><form id="login-form"><input id="password" type="password" placeholder="סיסמה" required><button>כניסה</button></form><p class="error" id="login-error"></p></section><section class="panel hidden" id="dashboard"><p><small>הפניות נשמרות בדפדפן שבו הן התקבלו.</small></p><button id="download">הורדת אקסל</button><button id="logout" style="margin-right:8px;background:#333;color:#fff">יציאה</button><div id="leads"></div></section></main>
<script>
const PASSWORD='מתקפלים123',login=document.querySelector('#login'),dashboard=document.querySelector('#dashboard'),leadsElement=document.querySelector('#leads'),getLeads=()=>JSON.parse(localStorage.getItem('foldingLeads')||'[]');
function show(){login.classList.add('hidden');dashboard.classList.remove('hidden');render()}function render(){const rows=getLeads();if(!rows.length){leadsElement.innerHTML='<p class="empty">עדיין לא התקבלו פניות.</p>';return}leadsElement.innerHTML=`<table><thead><tr><th>שם</th><th>טלפון</th><th>דואר אלקטרוני</th><th>תאריך</th></tr></thead><tbody>${rows.map(lead=>`<tr><td>${lead.name}</td><td>${lead.phone}</td><td>${lead.email||''}</td><td>${new Date(lead.createdAt).toLocaleString('he-IL')}</td></tr>`).join('')}</tbody></table>`}
document.querySelector('#login-form').addEventListener('submit',event=>{event.preventDefault();if(document.querySelector('#password').value===PASSWORD){sessionStorage.setItem('foldingAdmin','1');show()}else document.querySelector('#login-error').textContent='הסיסמה שגויה.'});document.querySelector('#logout').addEventListener('click',()=>{sessionStorage.removeItem('foldingAdmin');location.reload()});
document.querySelector('#download').addEventListener('click',()=>{const rows=getLeads(),csv=['שם,טלפון,דואר אלקטרוני,תאריך',...rows.map(lead=>[lead.name,lead.phone,lead.email||'',new Date(lead.createdAt).toLocaleString('he-IL')].map(value=>`"${String(value).replaceAll('"','""')}"`).join(','))].join('\r\n'),blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='פניות-מתקפלים.csv';link.click();URL.revokeObjectURL(url)});if(sessionStorage.getItem('foldingAdmin')==='1')show();
</script></body></html>
